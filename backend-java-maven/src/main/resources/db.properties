# =============================================================================
# Configuración del Pool de Conexiones JDBC (HikariCP) para SVIS
# Compatible con MySQL 5.7+ y 8.0+ bajo XAMPP / Servidor Local
# =============================================================================
db.url=jdbc:mysql://localhost:3306/svis_db?serverTimezone=America/Bogota&useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
db.user=root
db.password=
db.poolSize=10
db.minIdle=2
db.connectionTimeout=10000
db.idleTimeout=300000
